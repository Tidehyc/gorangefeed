name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: gorangefeed
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7.0-alpine
        ports:
          - 6380:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=5

      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5673:5672
        options: --health-cmd="rabbitmq-diagnostics -q ping" --health-interval=10s --health-timeout=10s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Check Migration Immutability
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./scripts/check_migrations.sh origin/${{ github.base_ref }}
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run database migrations
        run: go run ./cmd/migrate -action up

      - name: Run unit & integration tests
        run: go test -v -cover ./internal/...

      - name: Build binaries
        run: |
          mkdir -p bin
          go build -o bin/api ./cmd/api
          go build -o bin/worker ./cmd/worker
          go build -o bin/migrate ./cmd/migrate
